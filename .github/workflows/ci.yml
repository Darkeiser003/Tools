name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-wine:
    name: Linux release tests + Windows under Wine
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux GUI, packaging and Wine test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libglib2.0-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev \
            libx11-dev libxtst-dev gcc-mingw-w64-x86-64 \
            wine wine64 xvfb xdotool imagemagick x11-utils \
            rsync trash-cli jq zip unzip file ripgrep shellcheck

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install stable Rust and Windows GNU target
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # verified upstream commit, 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu

      - name: Install checksum-verified Cargo security tools
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-audit,cargo-deny

      - name: Run complete Linux build and Wine E2E
        env:
          TMPDIR: ${{ runner.temp }}
          LTOOLS_REQUIRE_LOOPBACK_TESTS: '1'
        run: >-
          bash scripts/build.sh --windows-wine --no-appimage --allow-unsigned --strict-security --security-review
          --non-interactive --jobs 2
          --output "$RUNNER_TEMP/ltools-linux-dist"
          --release-dir "$RUNNER_TEMP/ltools-linux-release"
          --log "$RUNNER_TEMP/ltools-linux-build.log"

      - name: Preserve build outputs and diagnostic logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-wine-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ltools-linux-dist/
            ${{ runner.temp }}/ltools-linux-release/
            ${{ runner.temp }}/ltools-linux-build.log
          if-no-files-found: warn

  windows-native:
    name: Native Windows release tests
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # verified upstream commit, 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Run full native Windows build, tests, smoke and E2E
        shell: pwsh
        env:
          LTOOLS_REQUIRE_LOOPBACK_TESTS: '1'
          # Reproduce the value exported by some Windows CI/toolchain
          # environments. Cargo requires the profile override to be the
          # lowercase boolean true/false; the builder must normalize it.
          CARGO_PROFILE_RELEASE_INCREMENTAL: '0'
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'ltools-windows-dist'
          $release = Join-Path $env:RUNNER_TEMP 'ltools-windows-release'
          $log = Join-Path $env:RUNNER_TEMP 'ltools-windows-build.log'
          & ./scripts/build.ps1 -Force -AllowUnsigned -NonInteractive `
            -Output $dist -ReleaseOutput $release -Log $log

      - name: Preserve build outputs and diagnostic logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-native-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ltools-windows-dist/
            ${{ runner.temp }}/ltools-windows-release/
            ${{ runner.temp }}/ltools-windows-build.log
          if-no-files-found: warn
